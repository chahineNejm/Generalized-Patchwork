[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "generalized-patchwork-gp"
version = "0.1.0"
description = "Reusable SVGP and generalized Patchwork Gaussian-process building blocks"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Chahine Nejm"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "torch>=2.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
data = [
  "gdown>=5.2",
  "netCDF4>=1.6",
  "xarray>=2024.1",
]
visual = ["matplotlib>=3.8"]
heat = ["scikit-fem==12.0.2", "matplotlib>=3.8"]
benchmark = ["pyreadr>=0.5.7"]
ukhousing = ["gpytorch==1.15.2", "linear_operator==0.6.1", "faiss-cpu==1.13.2", "matplotlib>=3.8"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
pwgp-data = "pwgp.data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

